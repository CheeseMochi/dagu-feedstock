name: release

# Runs on a deliberate `git tag vX.Y.Z && git push origin vX.Y.Z` after the version bump is
# merged (RELEASING.md). Builds each platform on its own runner and uploads it to the
# cheesemochi channel; needs the ANACONDA_API_TOKEN secret.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    strategy:
      matrix:
        include:
          - {os: macos-latest, subdir: osx-arm64}
          - {os: macos-15-intel, subdir: osx-64}
          - {os: ubuntu-latest, subdir: linux-64}
          - {os: ubuntu-24.04-arm, subdir: linux-aarch64}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    env:
      CONDA_PLUGINS_USE_SHARDED_REPODATA: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the recipe
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          meta_version=$(sed -nE 's/.*set version = "([^"]+)".*/\1/p' recipe/meta.yaml)
          [ "$tag_version" = "$meta_version" ] ||
            { echo "::error::tag $GITHUB_REF_NAME does not match recipe version $meta_version" >&2; exit 1; }

      - uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: build
          python-version: "3.12"
          channels: conda-forge
          channel-priority: strict

      - run: conda install -n build -c conda-forge conda-build anaconda-client -y

      - name: Build and test
        run: bash tests/run.sh

      - name: Upload to anaconda.org
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          set -euo pipefail
          path=$(ls -t "$CONDA_PREFIX"/conda-bld/${{ matrix.subdir }}/dagu-*.conda | head -1)
          anaconda -t "$ANACONDA_API_TOKEN" upload -u cheesemochi "$path"

  github-release:
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --title "dagu $version" \
            --notes "Dagu $version for conda (cheesemochi channel). Upstream release notes: https://github.com/dagucloud/dagu/releases/tag/v$version"
